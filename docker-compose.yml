version: '3.8'

services:
  whatsapp-avatar-service:
    container_name: whatsapp-avatar-service
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsapp-avatar-app
    ports:
      - "5002:5002"
    networks:
      - fogis-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      # Optional: Mount custom assets directory if you want to update assets without rebuilding
      - ./assets:/app/assets:ro
    environment:
      - TZ=Europe/Stockholm
      # Flask configuration
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
      # Redis configuration
      - REDIS_URL=redis://fogis-redis:6379
      - REDIS_PUBSUB_ENABLED=true
      - REDIS_AVATAR_REQUESTS_CHANNEL=fogis:avatars:requests
      - REDIS_AVATAR_RESULTS_CHANNEL=fogis:avatars:results
      - REDIS_SERVICE_STATUS_CHANNEL=fogis:avatars:status
      # Processing configuration
      - AVATAR_RESULT_STORAGE=base64
      - AVATAR_PROCESSING_TIMEOUT=30
      # Communication mode: 'http', 'redis', or 'dual' (default: dual for backward compatibility)
      - COMMUNICATION_MODE=dual
    depends_on:
      - fogis-redis

  fogis-redis:
    image: redis:7-alpine
    container_name: fogis-redis
    networks:
      - fogis-network
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:

networks:
  fogis-network:
    # If the network already exists and should be used (not created)
    external: true
